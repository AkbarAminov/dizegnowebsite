services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dizegno
      POSTGRES_PASSWORD: dizegno
      POSTGRES_DB: dizegno
    ports:
      # 5433 on the host so it never clashes with a default local Postgres.
      - "5433:5432"
    volumes:
      - dizegno_new_pgdata:/var/lib/postgresql/data

volumes:
  dizegno_new_pgdata:
