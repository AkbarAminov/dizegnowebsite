# Local development stack: `make up`. No Dockerfile — the app runs from the
# official node:22-alpine image with the repo bind-mounted, so edits on the
# host hot-reload inside the container.
#
# All values come from the root .env (see .env.example). The Makefile passes
# `--project-directory .` so Compose reads that file for ${VAR} substitution.
name: dizegno

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # Matches the server (out-bot's Ansible sets the same plugin): the MariaDB
    # driver Prisma uses talks to MySQL over plain TCP without SSL.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in .env}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm install --no-audit --no-fund
      && for i in 1 2 3 4 5; do npx prisma migrate deploy && break || sleep 5; done
      && npm run dev"
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Overrides the host-oriented DATABASE_URL from .env with the in-network one.
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      # Keep platform-specific build output out of the host checkout.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:
  node_modules:
  next_cache:
