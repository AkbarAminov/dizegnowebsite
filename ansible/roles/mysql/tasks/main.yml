---
# The server already runs MySQL (installed and hardened by out-bot's playbook:
# bind-address 0.0.0.0, default_authentication_plugin=mysql_native_password).
# This role only carves out a database and a user for this project.
- name: Ensure the Python MySQL driver is present
  apt:
    name: python3-pymysql
    state: present
    update_cache: true

- name: Create database
  ansible.mysql.mysql_db:
    name: "{{ mysql_db }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

# '%' covers both the Docker bridge (the app container) and 127.0.0.1 loopback
# used by the image build.
- name: Create database user
  ansible.mysql.mysql_user:
    name: "{{ mysql_user }}"
    password: "{{ mysql_password }}"
    host: "%"
    plugin: mysql_native_password
    priv: "{{ mysql_db }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true

# UFW denies incoming by default, which includes traffic from containers.
- name: Allow Docker bridge networks to reach MySQL
  community.general.ufw:
    rule: allow
    from_ip: 172.16.0.0/12
    port: "3306"
    proto: tcp
